<main id="track-main" class="spbc-main spbc-section" tabindex="-1">
  <div class="max-w-lg mx-auto">
    <h2 class="ducks-font text-3xl sm:text-4xl text-white mb-3 text-center">Order lookup</h2>
    <form id="trackForm" class="depth-card p-5 sm:p-6 space-y-4" novalidate>
      <div>
        <label for="trackOrder" class="block text-[10px] tracking-[0.2em] uppercase text-zinc-500 mb-1">Order number</label>
        <input id="trackOrder" name="order_number" type="text" autocomplete="off" required
               class="w-full bg-black border border-zinc-700 rounded-xl px-3 py-2.5 text-white uppercase tracking-wider"
               placeholder="e.g. L1IL2052J9">
      </div>
      <div>
        <label for="trackEmail" class="block text-[10px] tracking-[0.2em] uppercase text-zinc-500 mb-1">Email</label>
        <input id="trackEmail" name="email" type="email" autocomplete="email" required
               class="w-full bg-black border border-zinc-700 rounded-xl px-3 py-2.5 text-white">
      </div>
      <p id="trackError" class="text-red-400 text-sm hidden" role="alert"></p>
      <button id="trackBtn" type="submit" class="btn-primary inline-flex w-full justify-center py-3 rounded-xl text-sm font-bold">
        Look up order
      </button>
    </form>

    <div id="trackResult" class="depth-card p-5 sm:p-6 mt-6 space-y-4 hidden" aria-live="polite"></div>

    <p class="text-xs text-zinc-500 text-center mt-6">
      Can't find your order number? <a href="/contact.html" class="text-[#EAB308] hover:underline">Contact us</a>.
    </p>
  </div>
</main>
