    <section class="page-hero"{{#if hero_aria}} aria-label="{{hero_aria}}"{{/if}}>
      <video class="page-hero-video" aria-hidden="true" muted playsinline loop preload="none"
        poster="{{video_poster}}"
        data-src-webm="{{video_webm}}"
        data-src-mp4="{{video_mp4}}"
        data-poster="{{video_poster}}"></video>
      <div class="page-hero-blobs" aria-hidden="true">
        <svg class="blob-a" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="{{blob_id}}A" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#16A34A" stop-opacity="0.55"/>
              <stop offset="55%" stop-color="#006600" stop-opacity="0.35"/>
              <stop offset="100%" stop-color="#EAB308" stop-opacity="0.18"/>
            </linearGradient>
          </defs>
          <path fill="url(#{{blob_id}}A)" d="M440.5,323.5Q418,397,349.5,430.5Q281,464,214,424.5Q147,385,112,317.5Q77,250,116.5,187.5Q156,125,226.5,101.5Q297,78,361,115.5Q425,153,444,201.5Q463,250,440.5,323.5Z"/>
        </svg>
        <svg class="blob-b" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="{{blob_id}}B" x1="100%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#EAB308" stop-opacity="0.22"/>
              <stop offset="100%" stop-color="#16A34A" stop-opacity="0.28"/>
            </linearGradient>
          </defs>
          <path fill="url(#{{blob_id}}B)" d="M421,334Q392,418,312.5,441.5Q233,465,168.5,411.5Q104,358,95.5,274.5Q87,191,154,138.5Q221,86,304.5,92Q388,98,429,174Q470,250,421,334Z"/>
        </svg>
      </div>
      <div class="page-hero-orb page-hero-orb--green" aria-hidden="true"></div>
      <div class="page-hero-orb page-hero-orb--gold" aria-hidden="true"></div>
      <div class="page-hero-inner">
        <p class="page-hero-eyebrow">{{eyebrow}}</p>
        <h1 class="page-hero-title ducks-font hero-gold-underline">{{hero_title}}</h1>
        <p class="page-hero-sub">{{hero_sub}}</p>
        <div class="page-hero-cta">
          <a href="{{cta_primary_href}}" class="btn-primary btn-magnetic">{{cta_primary_text}}</a>
          <a href="{{cta_secondary_href}}" class="btn-secondary">{{cta_secondary_text}}</a>
        </div>
        <div class="trust-badges" role="list">
          <span class="trust-badge" role="listitem">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
            Research only
          </span>
          <span class="trust-badge" role="listitem">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
            Bulk pricing
          </span>
          <span class="trust-badge" role="listitem">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 00-2.91-.09z"/><path d="M12 15l-3-3a22 22 0 012-3.95A12.88 12.88 0 0122 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 01-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>
            Dosage tools
          </span>
        </div>
      </div>
    </section>
