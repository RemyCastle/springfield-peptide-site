    <section class="page-hero hero26"{{#if hero_aria}} aria-label="{{hero_aria}}"{{/if}}>
      <div class="page-hero-inner">
        <div class="hero26__text">
          <p class="page-hero-eyebrow">{{eyebrow}}</p>
          <h1 class="page-hero-title">{{hero_title}}</h1>
          <p class="page-hero-sub">{{hero_sub}}</p>
          <div class="page-hero-cta">
            <a href="{{cta_primary_href}}" class="btn-primary">{{cta_primary_text}}</a>
            <a href="{{cta_secondary_href}}" class="btn-secondary">{{cta_secondary_text}}</a>
          </div>
          {{#if hero_facts}}
          <ul class="hero26__facts" aria-label="How SPBC works">
            <li>Research use only · 21+</li>
            <li>2 vials or 1 kit minimum</li>
            <li>Tracking on every order</li>
            <li>Venmo · Chime · PayPal</li>
          </ul>
          {{/if}}
        </div>
      </div>
    </section>
