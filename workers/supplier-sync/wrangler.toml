# spbc-supplier-sync: keeps SPBC prices and stock in line with show-me-source.
# Deploy from this folder: npx wrangler deploy   (iCloud Cloudflare account, same as springfieldpeps)
# Secrets, set by Remy only:  npx wrangler secret put SMS_SITE_KEY
#                             npx wrangler secret put SMS_PRICING_CODE
# supplier@springfieldpbc.com mailbox: Remy sets the senders allowed to forward (his Outlook):
#   npx wrangler secret put ALLOWED_FORWARDERS
# Optional, for all emails (restock, price drop, payment reminder, digest):
#   npx wrangler secret put RESEND_API_KEY   and set RESTOCK_FROM below.
# Optional, for payment reminders + digest (same values as the springfieldpeps Pages settings):
#   npx wrangler secret put ORDERS_ADMIN_TOKEN   and set ORDERS_PUBLIC_URL below.
name = "spbc-supplier-sync"
main = "src/index.js"
compatibility_date = "2024-11-12"
# workers.dev is on only for /partner-prices (bearer-token protected; partner prices only).
workers_dev = true
preview_urls = false

[triggers]
crons = ["17 */2 * * *", "0 13 * * *"] # sync + reminders every 2h; digest daily 13:00 UTC (7am Central)

[vars]
# "1" = test mode: log what would change, change nothing. Set to "0" after Remy reviews a few runs.
DRY_RUN = "1"
# Partner (Patriotic) wholesale markups over the supplier price.
PARTNER_VIAL_MARKUP = "15"
PARTNER_KIT_MARKUP = "100"
# e.g. "SPBC <orders@springfieldpbc.com>". Empty = no emails at all (sign-ups wait in the admin).
RESTOCK_FROM = ""
# The spbc-orders URL (Outlook account). Reminders + digest also need the ORDERS_ADMIN_TOKEN secret.
ORDERS_PUBLIC_URL = "https://spbc-orders.remycastle.workers.dev"
# supplier@springfieldpbc.com: mail straight from these domains is trusted when DKIM/SPF pass.
TRUSTED_SENDER_DOMAINS = "show-me-source.com"
# Optional: send a copy of show-me-source mail here (must be a verified Email Routing destination).
COPY_TO = ""

[[d1_databases]]
binding = "DB"
database_name = "springfieldpeps-db"
database_id = "67d60e74-cd83-46a7-b907-3a0b3437ceb3"
